default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("DB_USER", "postgres") %>
  password: <%= ENV.fetch("DB_PASSWORD", "postgres") %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: ingenieria_en_computacion_development

test:
  <<: *default
  database: ingenieria_en_computacion_test

production:
  primary: &primary_production
    <<: *default
    database: ingenieria_en_computacion_production
    username: ingenieria_en_computacion
    password: <%= ENV["INGENIERIA_EN_COMPUTACION_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: ingenieria_en_computacion_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: ingenieria_en_computacion_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: ingenieria_en_computacion_production_cable
    migrations_paths: db/cable_migrate
