name: CI

on:
  pull_request:
    branches: [main, test, prod]
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: ruby/setup-ruby@v1
        with: { bundler-cache: true }
      - uses: actions/setup-node@v4
        with: { node-version: lts/* }
      - run: npm install -g markdownlint-cli2 @commitlint/cli
      - run: pip install --break-system-packages yamllint
      - run: bundle exec rubocop
      - run: bundle exec erb_lint --lint-all
      - run: markdownlint-cli2
      - run: commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
        if: github.event_name == 'pull_request'
      - run: yamllint .
      - run: bundle exec cuke_linter
      - run: bundle exec i18n-tasks health
      - run: bundle exec reek || true
      - run: bundle exec rails_best_practices . || true
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with: { bundler-cache: true }
      - run: bundle exec brakeman -q --no-pager
      - run: bundle exec bundler-audit check --update
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5433:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      RAILS_ENV: test
      CI: "true"
      DB_HOST: localhost
      DB_PORT: 5433
      DB_USER: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with: { bundler-cache: true }
      - run: bin/rails db:prepare
      - run: bin/rails tailwindcss:build
      - run: bundle exec rspec
      - run: bundle exec cucumber
      - run: bin/coverage-check
      - uses: actions/upload-artifact@v4
        if: ${{ always() && !env.ACT }}
        with: { name: coverage, path: coverage }
